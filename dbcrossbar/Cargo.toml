[package]
name = "dbcrossbar"
version = "1.0.1-pre.1"
authors = ["Eric Kidd <git@randomhacks.net>", "Seamus Abshere seamus@abshere.net"]
edition = "2021"

description = "Program for copying data between databases (pre-release)"
categories = ["command-line-utilities", "database", "filesystem"]
keywords = ["postgresql", "bigquery", "database", "csv"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
homepage = "https://www.dbcrossbar.org/"
repository = "https://github.com/dbcrossbar/dbcrossbar"
documentation = "https://www.dbcrossbar.org/"

[dev-dependencies]
cli_test_dir = "0.1.8"
csv = "1.4.0"
dbcrossbar_trino = { version = "0.2.0", path = "../crates/dbcrossbar_trino", features = [
    "client",
    "values",
    "proptest",
    "rustls-tls",
    "macros",
] }
difference = "2.0"
opinionated_telemetry = { version = "0.2.0", path = "../crates/opinionated_telemetry", features = [
    "sync",
] }
pretty_assertions = "1.4.1"
proptest = "1.9.0"
proptest-derive = "0.7.0"
tempfile = "3"
tracing-subscriber = "0.3.22"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
async-trait = "0.1.89"
base64 = "0.22"
big_enum_set = "0.3"
byteorder = "1.5.0"
bytes = "1.11.0"
cast = "0.3.0"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["wrap_help", "derive"] }
codespan-reporting = "0.13"
crc32c = "0.6.8"
csv = "1.4.0"
dbcrossbar_trino = { version = "0.2.0", path = "../crates/dbcrossbar_trino", features = [
    "client",
    "values",
    "rustls-tls",
    "macros",
] }
dirs = "6.0"
futures = "0.3.31"
geo-types = "0.7.17"
geojson = { version = "0.24", features = ["geo-types"] }
headers = "0.4"
http = "1.4"
http-body-util = "0.1"
hex = "0.4.3"
hmac = "0.12.1"
humanize-rs = "0.1.5"
hyper = "1.8"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "aws-lc-rs"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2"] }
include-flate = "0.3"
itertools = "0.14"
lazy_static = "1.5.0"
log = "0.4.28"
metrics = "0.24"
mime = "0.3.17"
opener = "0.8"
opinionated_telemetry = { version = "0.2.0", path = "../crates/opinionated_telemetry" }
parse_link_header = "0.4"
peg = "0.8"
percent-encoding = "2.3.2"
postgis = "0.9.0"
pretty = "0.12.5"
rand = "0.9"
regex = "1.12.2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots-no-provider",
    "json",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
sha-1 = "0.10.1"
sha2 = "0.10.9"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
strum = "0.27"
strum_macros = "0.27"
tempfile = "3"
termcolor = "1.4.1"
tokio = { version = "1.48.0", features = [
    "fs",
    "io-std",
    "io-util",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-postgres = "0.7.15"
tokio-postgres-rustls = "0.13"
tokio-stream = { version = "0.1.17", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml_edit = "0.23"
tracing = "0.1.43"
url = "2.5.7"
uuid = "1.18"
walkdir = "2.5.0"
gcp_auth = { version = "0.12", default-features = false }
